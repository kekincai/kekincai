<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="00 / Signal — I build focused tools across native Apple platforms, AI workflows, and local data. Based in Tokyo.">
<title>00 / Signal — I build focused tools across native Apple platforms, AI workflows, and local data. Based in Tokyo.</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.09 0"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <path id="petal" d="M0 0 C3 -5 10 -5 9 1 C8 6 2 7 0 0 Z"/>
  <style>
    .serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif CJK JP','Noto Serif JP','Songti SC',serif}
    .jp{font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif CJK JP','Noto Serif JP','Songti SC',serif}
    .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
  </style>
  
</defs>

  <clipPath id="c"><rect width="900" height="290" rx="20"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="900" height="290" fill="#F5EFE4"/>
    
    <text x="54" y="66" class="mono" font-size="12" letter-spacing="3.5" fill="#C25B6E">00 / SIGNAL</text>
    <text x="178" y="66" class="jp" font-size="12" letter-spacing="3" fill="#8C978F">信号</text>
    <text x="54" y="110" class="jp" font-size="23" fill="#2E3B37" letter-spacing="1.5">東京で、日々の小さな摩擦を</text><text x="54" y="146" class="jp" font-size="23" fill="#2E3B37" letter-spacing="1.5">ほどくソフトウェアをつくっています。</text>
    <text x="54" y="192" class="serif" font-size="15" fill="#5D6B64">I build focused tools across native Apple platforms, AI workflows,</text><text x="54" y="215" class="serif" font-size="15" fill="#5D6B64">and local data. The stack changes; the standard does not — clear</text><text x="54" y="238" class="serif" font-size="15" fill="#5D6B64">purpose, observable behavior, and software that earns its place.</text>
    <g transform="translate(590 58)">
    <rect width="250" height="176" rx="10" fill="#FBF7EF" stroke="#E4D8C4" stroke-width="1.5"/>
    <path d="M0 44 H250" stroke="#E4D8C4" stroke-dasharray="4 4"/>
    <circle cx="0" cy="44" r="8" fill="#F5EFE4" stroke="#E4D8C4"/><circle cx="250" cy="44" r="8" fill="#F5EFE4" stroke="#E4D8C4"/>
    <text x="20" y="29" class="jp" font-size="16" fill="#2E3B37" letter-spacing="4">乗車券</text>
    <text x="230" y="28" class="mono" font-size="10" letter-spacing="2" fill="#C25B6E" text-anchor="end">RIDE PASS</text>
    <text x="20" y="76" class="mono" font-size="10" letter-spacing="1.5" fill="#8C978F">FROM</text><text x="78" y="76" class="mono" font-size="11.5" letter-spacing=".6" fill="#2E3B37">TOKYO  35.6762° N</text><text x="20" y="102" class="mono" font-size="10" letter-spacing="1.5" fill="#8C978F">FOCUS</text><text x="78" y="102" class="mono" font-size="11.5" letter-spacing=".6" fill="#2E3B37">AI × NATIVE × LOCAL</text><text x="20" y="128" class="mono" font-size="10" letter-spacing="1.5" fill="#8C978F">MODE</text><text x="78" y="128" class="mono" font-size="11.5" letter-spacing=".6" fill="#2E3B37">BUILD TO UNDERSTAND</text><text x="20" y="154" class="mono" font-size="10" letter-spacing="1.5" fill="#8C978F"></text><text x="78" y="154" class="mono" font-size="11.5" letter-spacing=".6" fill="#2E3B37">SHIP TO LEARN</text>
    <g transform="translate(222 150) rotate(-12)" opacity=".85"><circle r="18" fill="none" stroke="#C25B6E" stroke-width="1.8"/><circle r="14" fill="none" stroke="#C25B6E" stroke-width=".8"/><text y="5" class="jp" font-size="13" fill="#C25B6E" text-anchor="middle">済</text></g>
  </g>
