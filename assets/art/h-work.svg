<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90" role="img" aria-label="01 Selected Work — 選んだ仕事">
<title>01 Selected Work — 選んだ仕事</title>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.09 0"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <path id="petal" d="M0 0 C3 -5 10 -5 9 1 C8 6 2 7 0 0 Z"/>
  <style>
    .serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif CJK JP','Noto Serif JP','Songti SC',serif}
    .jp{font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif CJK JP','Noto Serif JP','Songti SC',serif}
    .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
  </style>
  
</defs>

  <clipPath id="c"><rect width="900" height="90" rx="20"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="900" height="90" fill="#F5EFE4"/>
    
    <path d="M110 68 C300 62 520 72 800 64" stroke="#E4D8C4" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g transform="translate(78 46)"><g fill="#EFB7C3"><circle cx="0" cy="-9.92" r="8"/><circle cx="9.43" cy="-3.07" r="8"/><circle cx="5.83" cy="8.03" r="8"/><circle cx="-5.83" cy="8.03" r="8"/><circle cx="-9.43" cy="-3.07" r="8"/></g><circle cx="0" cy="0" r="4.48" fill="#D6879A"/></g>
    <text x="118" y="52" class="mono" font-size="13" letter-spacing="4" fill="#C25B6E">01</text>
    <text x="160" y="54" class="serif" font-size="26" fill="#2E3B37" letter-spacing="2">Selected Work</text>
    <text x="840" y="54" class="jp" font-size="15" fill="#8C978F" letter-spacing="6" text-anchor="end">選んだ仕事</text>
    
    <use href="#petal" fill="#EFB7C3" transform="translate(607 72) rotate(20)"/><use href="#petal" fill="#EFB7C3" transform="translate(677 78) rotate(90)"/><use href="#petal" fill="#EFB7C3" transform="translate(747 72) rotate(160)"/>
    
    <rect width="900" height="90" rx="0" filter="url(#grain)" opacity="1"/>
  </g>
  <rect x=".75" y=".75" width="898.5" height="88.5" rx="19.5" fill="none" stroke="#E4D8C4" stroke-width="1.5"/>
</svg>
