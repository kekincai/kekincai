<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Paul Cai — Building practical AI systems</title>
  <desc id="desc">A dark blue and violet banner with an abstract neural network and the words AI, systems, and craft.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#101b3d"/>
      <stop offset="1" stop-color="#24134f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="150" r="240" fill="url(#glow)"/>
  <path d="M64 64h96" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="135" fill="#f8fafc" font-size="58" font-weight="760" letter-spacing="-1.5">Paul Cai</text>
    <text x="64" y="191" fill="url(#accent)" font-size="30" font-weight="650">Building practical AI systems</text>
    <text x="64" y="239" fill="#cbd5e1" font-size="20" letter-spacing=".5">LLM FROM FIRST PRINCIPLES  ·  MCP  ·  AI WORKFLOWS</text>
    <text x="64" y="302" fill="#94a3b8" font-size="17">Tokyo, Japan  /  learning deeply, shipping thoughtfully</text>
  </g>

  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity=".72">
    <path d="M802 96l86-34 77 50 90-36 81 63"/>
    <path d="M802 96l40 92 91-29 73 78 130-98"/>
    <path d="M842 188l-19 82 110-111 21 117 52-39 87 55"/>
    <path d="M888 62l45 97 32-47 41 125 49-161 38 216"/>
  </g>
  <g fill="#e0f2fe">
    <circle cx="802" cy="96" r="5"/><circle cx="888" cy="62" r="6"/>
    <circle cx="965" cy="112" r="5"/><circle cx="1055" cy="76" r="6"/>
    <circle cx="1136" cy="139" r="5"/><circle cx="842" cy="188" r="6"/>
    <circle cx="933" cy="159" r="7"/><circle cx="1006" cy="237" r="6"/>
    <circle cx="823" cy="270" r="5"/><circle cx="954" cy="276" r="5"/>
    <circle cx="1093" cy="292" r="6"/>
  </g>
  <g fill="#60a5fa" opacity=".7" filter="url(#softGlow)">
    <circle cx="933" cy="159" r="13"/><circle cx="1055" cy="76" r="11"/>
    <circle cx="1093" cy="292" r="11"/>
  </g>
</svg>
